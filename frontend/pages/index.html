<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prizma - Home</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <aside id="sidebar">
        <div class="sidebar__profile">
            <img src="../assets/Primh.png" alt="profile picture" class="sidebar__profile-img">
            <div class="sidebar__profile-info">
                <span class="sidebar__profile-name">Kevin Parra</span>
                <span class="sidebar__profile-email">kevin@example.com</span>
            </div>
        </div>
        <nav class="sidebar__nav">
            <ul class="sidebar__nav-list">
                <li class="sidebar__nav-item">
                    <a href="index.html" class="sidebar__nav-link">
                        <svg style="width: 24px; height: 24px;">
                            <use href="../assets/icons/sprite.svg#icon-home"></use>
                        </svg>
                        <span>Home</span>
                    </a>
                </li>
    
                <li class="sidebar__nav-item active">
                    <a href="#" class="sidebar__nav-link">
                        <svg style="width: 24px; height: 24px;"><use href="../assets/icons/sprite.svg#icon-space-dashboard"></use></svg>
                        <span>My Space</span>
                    </a>
                </li>
    
                <li class="sidebar__nav-item">
                    <a href="#" class="sidebar__nav-link">
                        <svg style="width: 24px; height: 24px;"><use href="../assets/icons/sprite.svg#icon-favorite"></use></svg>
                        <span>Favorites</span>
                    </a>
                </li>
    
                <li class="sidebar__nav-item">
                    <a href="#" class="sidebar__nav-link">
                        <svg style="width: 24px; height: 24px;"><use href="../assets/icons/sprite.svg#icon-share"></use></svg>
                        <span>Share</span>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="sidebar__settings">
            <ul class="sidebar__settings-list">
                <li class="sidebar__settings-item">
                    <a href="settings.html" class="sidebar__settings-link">
                        <svg style="width: 24px; height: 24px;"><use href="../assets/icons/sprite.svg#icon-settings"></use></svg>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </div>
    </aside>
    <!-- Main Content -->
    <main class="main-grid">
        <header class="main__grid-header">
            <h2>Notes</h2>
            <div class="header__btn-continer">
                <button class="addNote-btn" id="addNote-btn" aria-label="Create new note">
                    <svg style="width: 24px; height: 24px;"><use href="../assets/icons/sprite.svg#icon-add"></use></svg>
                    New Note
                </button>
            </div>
        </header>
        <section class="lists-wrapper" aria-label="Listas de tareas">
            <!-- Cards generadas dinámicamente desde JS -->
        </section>
    </main>
    <!-- New Card Dialog -->
    <dialog id="myDialog" aria-labelledby="dialog-title" closedby="any">
        <span class="bar" style="background-color: #f2f2f2;"></span>
        <form method="dialog" class="dialog-form">
            <h2 id="dialog-title" class="dialog-form__title">Appearance</h2>

            <label for="userAnswer" class="dialog-form__label">Title Name</label>
            <input type="text" id="userAnswer" class="dialog-form__input" placeholder="Untitled">

            <fieldset class="dialog-form__fielset">
                <legend class="dialog-form__legend">Customisation</legend>

                <div class="dialog-form__option">
                    <label for="todo-tags">Tags</label>
                    <input type="text" id="todo-tags" class="dialog-form__tags" placeholder="Personal">
                </div>

                <div class="dialog-form__option">
                    <label for="marker">Marker</label>
                    <input type="text" id="marker" maxlength="2" class="dialog-form__marker" placeholder="📌">
                </div>

                <div class="dialog-form__option">
                    <label>Color</label>
                    <div class="color-picker">
                        <button type="button" class="color-opt selected" data-color="#f1f1f1" style="background-color: #787878;"></button>
                        <button type="button" class="color-opt" data-color="#fdefee" style="background-color: #ed6b5a;"></button>
                        <button type="button" class="color-opt" data-color="#e6f2ff" style="background-color: #038cff;"></button>
                        <button type="button" class="color-opt" data-color="#e1fae7" style="background-color: #36c25c;"></button>
                        <button type="button" class="color-opt" data-color="#fcf5db" style="background-color: #e6961f;"></button>
                        <button type="button" class="color-opt" data-color="#efeaff" style="background-color: #6d3cfa;"></button>
                    </div>
                </div>
            </fieldset>

            <div class="dialog-form__actions">
                <button type="button" class="dialog-btn dialog-btn--cancel" id="btn-cancel">Cancelar</button>
                <button type="submit" class="dialog-btn dialog-btn--confirm" id="btn-acept" value="default">Agregar</button>
            </div>
        </form>
    </dialog>
    <!-- DIALOG CARD -->
    <dialog id="card-dialog" closedby="any">
		<header class="card-dialog__header">
			<input class="card-dialog__title" type="text" placeholder="Untitled">
            <button id="card-dialog__close" class="card-dialog__close">
                <svg>
                    <use href="../assets/icons/sprite.svg#icon-close"></use>
                </svg> 
            </button>
		</header>
		<section class="card-dialog__content">
			<button class="add-content"><svg style="width: 24px; height: 24px; "><use href="../assets/icons/sprite.svg#icon-add"></use></svg>Add content</button>
		</section>
	</dialog>

    <!-- Dialog settings -->

    <script type="module" src="../js/main.js"></script>
</body>
</html>
