<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Prisma - Your Space</title>
    <meta name="description" content="Organiza tu día a día con Prisma. Crea listas de tareas, gestiona tus notas personales y personaliza tu espacio de trabajo de forma rápida y sencilla.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://prisma.nertv.com/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Prisma - Tu Espacio Personal de Notas">
    <meta property="og:description" content="Organiza tu día a día con Prisma. Gestiona tus notas personales de forma rápida y visual.">
    <meta property="og:image" content="../assets/og-image.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Prisma - Tu Espacio Personal de Notas">
    <meta name="twitter:description" content="Organiza tu día a día con Prizma. Gestiona tus notas personales de forma rápida y visual.">

    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <aside id="sidebar" class="sidebar" aria-label="Navegación lateral">
        <div class="sidebar__profile">
            <img src="../assets/Primh.png" alt="Foto de perfil de Kevin Parra" class="sidebar__profile-img" loading="lazy">
            <div class="sidebar__profile-info">
                <span class="sidebar__profile-name">Kevin Parra</span>
                <span class="sidebar__profile-email">kevin@example.com</span>
            </div>
        </div>
    
        <nav class="sidebar__nav" aria-label="Menú principal">
            <ul class="sidebar__nav-list">
                <li class="sidebar__nav-item">
                    <a href="index.html" class="sidebar__nav-link">
                        <svg style="width: 24px; height: 24px;" aria-hidden="true">
                            <use href="../assets/icons/sprite.svg#icon-home"></use>
                        </svg>
                        <span>Home</span>
                    </a>
                </li>
    
                <li class="sidebar__nav-item sidebar__nav-item--active">
                    <a href="#" class="sidebar__nav-link" aria-current="page">
                        <svg style="width: 24px; height: 24px;" aria-hidden="true">
                            <use href="../assets/icons/sprite.svg#icon-space-dashboard"></use>
                        </svg>
                        <span>Spaces</span>
                    </a>
                </li>
    
                <li class="sidebar__nav-item">
                    <a href="#" class="sidebar__nav-link">
                        <svg style="width: 24px; height: 24px;" aria-hidden="true">
                            <use href="../assets/icons/sprite.svg#icon-favorite"></use>
                        </svg>
                        <span>Favorites</span>
                    </a>
                </li>
    
                <li class="sidebar__nav-item">
                    <a href="#" class="sidebar__nav-link">
                        <svg style="width: 24px; height: 24px;" aria-hidden="true">
                            <use href="../assets/icons/sprite.svg#icon-share"></use>
                        </svg>
                        <span>Shares</span>
                    </a>
                </li>

                <li class="sidebar__nav-item">
                    <a href="#" class="sidebar__nav-link">
                        <svg style="width: 24px; height: 24px;" aria-hidden="true">
                            <use href="../assets/icons/sprite.svg#icon-folder"></use>
                        </svg>
                        <span>Folders</span>
                    </a>
                </li>
            </ul>
        </nav>
    
        <div class="sidebar__settings">
            <ul class="sidebar__settings-list">
                <li class="sidebar__settings-item">
                    <a href="settings.html" class="sidebar__settings-link">
                        <svg style="width: 24px; height: 24px;" aria-hidden="true">
                            <use href="../assets/icons/sprite.svg#icon-settings"></use>
                        </svg>
                        <span>Settings</span>
                    </a>
                </li>
            </ul>
        </div>
    </aside>

    <main class="main-content">
        <header class="main-content__header">
            <h1 class="main-content__title">Workspace</h1>
            
            <div class="main-content__actions">
                <button popovertarget="menu-create" class="main-content__btn main-content__btn--create" id="new-space-btn" aria-label="Create new Prisma-Space">
                    <svg style="width: 24px; height: 24px;" aria-hidden="true">
                        <use href="../assets/icons/sprite.svg#icon-add"></use>
                    </svg>
                    New Space
                </button>
                
                <div id="menu-create" popover class="main-content__menu" role="menu">
                    <button id="create-space-btn" class="main-content__menu-btn" data-space="normal">Space</button>
                    <button id="create-temporal-space-btn" class="main-content__menu-btn" data-space="temporal">Temp Space</button>
                </div>
            </div>
        </header>
    
        <section class="cards-display" aria-label="Mis notas y listas de tareas">
        </section>
    </main>

    <dialog id="card-dialog" closedby="any" aria-labelledby="modal-card-title">

        <aside class="card-dialog__sidebar" aria-label="Opciones de la tarjeta">
            <button type="button" class="sidebar-tab active" data-tab="content" aria-label="Edit content">
                <svg style="width: 24px; height: 24px;" aria-hidden="true">
                    <use href="../assets/icons/sprite.svg#icon-document"></use>
                </svg>
            </button>
            <button type="button" class="sidebar-tab" data-tab="appearance" aria-label="Personalize appearance">
                <svg style="width: 24px; height: 24px;" aria-hidden="true">
                    <use href="../assets/icons/sprite.svg#icon-palette"></use>
                </svg>
            </button>
        </aside>
    
        <div class="card-dialog__body">
            <header class="card-dialog__header">
                <input id="modal-card-title" class="card-dialog__title" type="text" placeholder="Untitled" aria-label="Título de la nota">
                <button id="card-dialog__close" class="card-dialog__close" aria-label="Close dialog">
                    <svg aria-hidden="true">
                        <use href="../assets/icons/sprite.svg#icon-close"></use>
                    </svg> 
                </button>
            </header>
    
            <section id="tab-content" class="tab-view active" aria-label="Contenido de la nota">
                <div class="card-dialog__content">
                    <button popovertarget="menu-add-content" class="add-content" aria-label="Opciones de la nota">
                        <svg style="width: 24px; height: 24px;" aria-hidden="true">
                            <use href="../assets/icons/sprite.svg#icon-add"></use>
                        </svg>
                        Add content
                    </button>
                    
                    <div id="menu-add-content" popover class="add-content-menu" role="menu">
                        <button role="menuitem" class="card-menu__btn">☑️ Task</button>
                        <button role="menuitem" class="card-menu__btn">📝 Note</button>
                    </div>
                </div>
            </section>
    
            <section id="tab-appearance" class="tab-view" aria-label="Apariencia de la nota">
                <div class="card-dialog__content">
                    <h2 class="dialog-form__title">Appearance</h2>
                    
                    <fieldset class="dialog-form__fielset">
                        <div class="dialog-form__option">
                            <label function="card-tags">Tags</label>
                            <input type="text" id="card-tags" class="dialog-form__tags" placeholder="Personal" name="tag">
                        </div>
    
                        <div class="dialog-form__option">
                            <label function="marker">Marker</label>
                            <input type="text" id="marker" maxlength="2" class="dialog-form__marker" placeholder="📌" name="marker">
                        </div>
    
                        <div class="dialog-form__option">
                            <span class="dialog-form__label-mock">Color</span>
                            <div class="color-picker" role="radiogroup" aria-label="Seleccionar color de fondo">
                                <button type="button" class="color-opt selected" data-color="#f1f1f1" style="background-color: #787878;" role="radio" aria-checked="true" aria-label="Gris"></button>
                                <button type="button" class="color-opt" data-color="#fdefee" style="background-color: #ed6b5a;" role="radio" aria-checked="false" aria-label="Rojo"></button>
                                <button type="button" class="color-opt" data-color="#e6f2ff" style="background-color: #038cff;" role="radio" aria-checked="false" aria-label="Azul"></button>
                                <button type="button" class="color-opt" data-color="#e1fae7" style="background-color: #36c25c;" role="radio" aria-checked="false" aria-label="Verde"></button>
                                <button type="button" class="color-opt" data-color="#fcf5db" style="background-color: #e6961f;" role="radio" aria-checked="false" aria-label="Amarillo"></button>
                                <button type="button" class="color-opt" data-color="#efeaff" style="background-color: #6d3cfa;" role="radio" aria-checked="false" aria-label="Morado"></button>
                            </div>
                        </div>
                    </fieldset>
                </div>
            </section>
        </div>
    </dialog>

    <dialog id="delete-confirmation-dialog" closedby="any" aria-labelledby="delete-dialog-title" aria-describedby="delete-dialog-desc">
        <form class="dialog-form" method="dialog">
            <h2 id="delete-dialog-title" class="dialog-form__title">Delete Note</h2>
            <p id="delete-dialog-desc" class="dialog-form__description">Are you sure you want to permanently delete this note? This action cannot be undone.</p>
            
            <div class="dialog-form__actions">
                <button type="button" value="cancel" class="dialog-btn dialog-btn--cancel">Cancel</button>
                <button type="submit" value="confirm" class="dialog-btn dialog-btn--danger">Delete</button>
            </div>
        </form>
    </dialog>

    <script type="module" src="../js/main.js"></script>
</body>
</html>
